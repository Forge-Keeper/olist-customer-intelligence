site_name: Olist Customer Intelligence
site_description: Engineering, architecture, data platform and API documentation for Olist Customer Intelligence.
repo_name: Forge-Keeper/olist-customer-intelligence
repo_url: https://github.com/Forge-Keeper/olist-customer-intelligence

site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Portfolio:
      - Architecture: architecture.md
      - Platform Status: platform-status.md
  - Data Features:
      - IBGE API Ingestion: development/ibge-api-ingestion.md
      - IBGE Municipality GDP: development/ibge-municipality-gdp.md
      - IBGE CEMPRE: development/ibge-cempre.md
  - Engineering:
      - Data Quality + Control Plane: development/data-quality-control-plane.md
      - Branch Governance: development/branch-governance.md
      - Standards & Naming: development/engineering-standards.md
      - Definition of Done: development/definition-of-done.md
      - Environment Hardcode Audit: development/environment-hardcode-audit.md
      - Feature Specification Template: templates/feature-specification-template.md
      - ADR Template: templates/adr-template.md
  - Platform & Delivery:
      - Databricks Asset Bundles: development/databricks-asset-bundles.md
      - Deployment Runbook: development/dab-deployment-runbook.md
      - Deployment Smoke Runbook: development/deployment-smoke-runbook.md
      - Historical Delivery Records:
          - Discovery: development/dab-platform-discovery.md
          - Requirements: development/dab-platform-requirements.md
          - Technical Design: development/dab-platform-technical-design.md
          - Impact Analysis: development/dab-platform-impact-analysis.md
          - Implementation Plan: development/dab-platform-implementation-plan.md
  - Architecture Decisions:
      - ADR-001 Liquid Clustering: adr/ADR-001-liquid-clustering-bronze-weather.md
      - ADR-002 Package Structure: adr/ADR-002-hybrid-domain-platform-package-structure.md
      - ADR-003 Bronze VARIANT Landing: adr/ADR-003-bronze-landing-with-variant.md
      - ADR-004 Executable Contracts: adr/ADR-004-executable-dataset-contracts-and-delta-lifecycle.md
      - ADR-005 DAB Environments: adr/ADR-005-dab-environment-and-promotion-boundary.md
      - ADR-006 Unity Catalog ABAC: adr/ADR-006-unity-catalog-abac-governance.md
      - ADR-007 Administrative Control Plane: adr/ADR-007-platform-administrative-control-plane.md
      - ADR-008 Data Quality Execution: adr/ADR-008-first-class-data-quality-execution-model.md
  - API Reference:
      - Delta Contracts: api/delta-contracts.md
      - Delta Lifecycle: api/delta-lifecycle.md
      - Bronze Writer: api/bronze-writer.md
      - Data Quality: api/data-quality.md
      - Operations: api/operations.md
