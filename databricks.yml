bundle:
  name: olist-customer-intelligence

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by this deployment target.
  gdp_periods:
    description: Comma-separated IBGE GDP reference years for the pilot job.
    default: "2016,2017,2018"
  run_as_service_principal:
    description: Service principal application ID injected by the deployment environment.

artifacts:
  default:
    type: whl
    path: .
    build: python scripts/build_bundle_artifact.py

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: dev

  stg:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    variables:
      catalog: stg

  prd:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    variables:
      catalog: prd
