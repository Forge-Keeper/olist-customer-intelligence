bundle:
  name: olist-customer-intelligence

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog data-plane catalog used by this deployment target.
  admin_catalog:
    description: Unity Catalog administrative control-plane catalog used by this deployment target.
  gdp_periods:
    description: Comma-separated IBGE GDP reference years for the pilot job.
    default: "2016,2017,2018"
  cempre_periods:
    description: Comma-separated IBGE CEMPRE reference years for Olist enrichment.
    default: "2016,2017,2018"
  run_as_service_principal:
    description: Service principal application ID injected by the deployment environment.

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: dev
      admin_catalog: dev_admin

  stg:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    variables:
      catalog: stg
      admin_catalog: stg_admin

  prd:
    mode: production
    git:
      branch: main
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.run_as_service_principal}
    variables:
      catalog: prd
      admin_catalog: prd_admin
