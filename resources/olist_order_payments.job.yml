resources:
  jobs:
    olist_order_payments:
      name: olist_order_payments
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_order_payments
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-order-payments
            parameters:
              - --source-path
              - /Volumes/${var.catalog}/bronze/raw_storage/raw/olist/e_commerce/olist_order_payments_dataset.csv
              - --target-table
              - ${var.catalog}.bronze.olist_order_payments
              - --execution-runs-table
              - ${var.admin_catalog}.operations.execution_runs
              - --quality-results-table
              - ${var.admin_catalog}.quality.data_quality_results
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
