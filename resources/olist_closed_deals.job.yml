resources:
  jobs:
    olist_closed_deals:
      name: olist_closed_deals
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_closed_deals
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-closed-deals
            parameters:
              - --source-path
              - /Volumes/${var.catalog}/bronze/raw_storage/raw/olist/funnel/olist_closed_deals_dataset.csv
              - --target-table
              - ${var.catalog}.bronze.olist_closed_deals
              - --execution-runs-table
              - ${var.admin_catalog}.operations.execution_runs
              - --quality-results-table
              - ${var.admin_catalog}.quality.data_quality_results
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
