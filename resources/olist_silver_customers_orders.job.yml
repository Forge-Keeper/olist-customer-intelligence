resources:
  jobs:
    olist_silver_customers_orders:
      name: olist_silver_customers_orders
      max_concurrent_runs: 1
      tasks:
        - task_key: silver_customers
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-silver-customers
            parameters:
              - --source-table
              - ${var.catalog}.bronze.olist_customers
              - --target-table
              - ${var.catalog}.silver.olist_customers
              - --execution-runs-table
              - ${var.admin_catalog}.operations.execution_runs
              - --quality-results-table
              - ${var.admin_catalog}.quality.data_quality_results
        - task_key: silver_orders
          depends_on:
            - task_key: silver_customers
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-silver-orders
            parameters:
              - --source-table
              - ${var.catalog}.bronze.olist_orders
              - --customers-table
              - ${var.catalog}.silver.olist_customers
              - --target-table
              - ${var.catalog}.silver.olist_orders
              - --execution-runs-table
              - ${var.admin_catalog}.operations.execution_runs
              - --quality-results-table
              - ${var.admin_catalog}.quality.data_quality_results
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
