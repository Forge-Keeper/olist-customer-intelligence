resources:
  jobs:
    olist_geolocation:
      name: olist_geolocation
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_geolocation
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-geolocation
            parameters:
              - --source-path
              - /Volumes/${var.catalog}/bronze/raw_storage/raw/olist/e_commerce/olist_geolocation_dataset.csv
              - --target-table
              - ${var.catalog}.bronze.olist_geolocation
              - --execution-runs-table
              - ${var.admin_catalog}.operations.execution_runs
              - --quality-results-table
              - ${var.admin_catalog}.quality.data_quality_results
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
