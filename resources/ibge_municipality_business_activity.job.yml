resources:
  jobs:
    ibge_municipality_business_activity:
      name: olist_ibge_municipality_business_activity
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_cempre
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-ibge-cempre
            parameters:
              - --target-table
              - ${var.catalog}.bronze.ibge_municipality_business_activity
              - --periods
              - ${var.cempre_periods}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
