resources:
  jobs:
    ibge_municipality_gdp:
      name: olist_ibge_municipality_gdp
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_gdp
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-ibge-gdp
            parameters:
              - --target-table
              - ${var.catalog}.bronze.ibge_municipality_gdp
              - --execution-runs-table
              - ${var.admin_catalog}.operations.execution_runs
              - --quality-results-table
              - ${var.admin_catalog}.quality.data_quality_results
              - --periods
              - ${var.gdp_periods}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
