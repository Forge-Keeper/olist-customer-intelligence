resources:
  jobs:
    ibge_municipality_gdp:
      name: olist_ibge_municipality_gdp
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_gdp
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-ibge-gdp
            parameters:
              - --target-table
              - ${var.catalog}.bronze.ibge_municipality_gdp
              - --periods
              - ${var.gdp_periods}
          libraries:
            - whl: ../dist/*.whl
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
