resources:
  jobs:
    olist_product_category_name_translation:
      name: olist_product_category_name_translation
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_product_category_name_translation
          environment_key: default
          python_wheel_task:
            package_name: olist-customer-intelligence
            entry_point: olist-category-translation
            parameters:
              - --source-path
              - /Volumes/${var.catalog}/bronze/raw_storage/raw/olist/e_commerce/product_category_name_translation.csv
              - --target-table
              - ${var.catalog}.bronze.olist_product_category_name_translation
              - --execution-runs-table
              - ${var.admin_catalog}.operations.execution_runs
              - --quality-results-table
              - ${var.admin_catalog}.quality.data_quality_results
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
