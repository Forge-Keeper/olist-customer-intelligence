name: Validate Data Quality DEV

on:
  push:
    branches:
      - feature/data-quality-control-plane
    paths:
      - '.github/workflows/validate-data-quality-dev.yml'

permissions:
  contents: read

jobs:
  validate-dev:
    name: validate-dq-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_run_as_service_principal: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout feature commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Databricks CLI
        uses: databricks/setup-cli@a0617808a1c52de06972a31670ce426578b35c7a # v1.14.0
        with:
          version: "1.14.0"

      - name: Verify Databricks authentication
        run: databricks current-user me

      - name: Validate DEV bundle
        run: databricks bundle validate -t dev

      - name: Deploy feature bundle to DEV
        run: databricks bundle deploy -t dev

      - name: Validate persisted DQ evidence and blocking write gate
        run: databricks bundle run -t dev data_quality_runtime_validation
