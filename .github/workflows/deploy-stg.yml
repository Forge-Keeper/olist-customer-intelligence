name: Deploy STG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stg
  cancel-in-progress: false

jobs:
  deploy-stg:
    name: deploy-stg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: olist-stg
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_run_as_service_principal: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Databricks CLI
        uses: databricks/setup-cli@a0617808a1c52de06972a31670ce426578b35c7a # v1.14.0
        with:
          version: "1.14.0"

      - name: Verify Databricks service principal authentication
        run: databricks current-user me

      - name: Validate staging bundle
        run: databricks bundle validate -t stg

      - name: Deploy staging bundle
        run: databricks bundle deploy -t stg

      - name: Run staging deployment smokes
        run: python scripts/run_deployment_smokes.py --target stg

      - name: Capture promoted wheel manifest
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          sha256sum "$wheel_path" | tee dist/SHA256SUMS
          printf 'git_sha=%s\nwheel=%s\n' "$(git rev-parse HEAD)" "$(basename "$wheel_path")" | tee dist/promotion-manifest.txt

      - name: Retain staging promotion artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stg-promotion-${{ github.sha }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
            dist/promotion-manifest.txt
            dist/deployment-smoke-results.txt
          if-no-files-found: error
          retention-days: 30
