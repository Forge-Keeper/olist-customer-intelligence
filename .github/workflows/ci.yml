name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-governance:
    name: branch-governance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Enforce feature to dev to main flow
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.base_ref }}'
          head='${{ github.head_ref }}'

          if [[ "$base" == "main" && "$head" != "dev" ]]; then
            echo "PRs into main must originate from dev. Received head=$head."
            exit 1
          fi

          if [[ "$base" == "dev" && ( "$head" == "main" || "$head" == "dev" ) ]]; then
            echo "PRs into dev must originate from a topic branch. Received head=$head."
            exit 1
          fi

          echo "Branch promotion path accepted: $head -> $base"

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ci
    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_run_as_service_principal: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest -q

      - name: Validate deployment smoke coverage
        run: uv run python scripts/run_deployment_smokes.py --validate-only

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel artifact
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          echo "wheel_path=$wheel_path"
          echo "git_sha=$(git rev-parse HEAD)"
          echo "git_short_sha=$(git rev-parse --short HEAD)"
          case "$(basename "$wheel_path")" in
            *+g*.whl) ;;
            *)
              echo "Wheel does not contain Git-derived local version metadata."
              exit 1
              ;;
          esac

      - name: Install wheel in isolated environment
        run: |
          uv venv .venv-wheel-test --python 3.11
          uv pip install --python .venv-wheel-test/bin/python "pyspark>=4.2.0" dist/*.whl

      - name: Verify packaged job entry points
        run: |
          .venv-wheel-test/bin/olist-ibge-gdp --help
          .venv-wheel-test/bin/olist-ibge-cempre --help
          .venv-wheel-test/bin/olist-mql --help

      - name: Install Databricks CLI
        uses: databricks/setup-cli@a0617808a1c52de06972a31670ce426578b35c7a # v1.14.0
        with:
          version: "1.14.0"

      - name: Verify Databricks service principal authentication
        run: databricks current-user me

      - name: Validate Databricks bundle targets
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t stg
          databricks bundle validate -t prd
