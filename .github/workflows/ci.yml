name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest -q

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel artifact
        run: test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Install wheel in isolated environment
        run: |
          uv venv .venv-wheel-test --python 3.11
          uv pip install --python .venv-wheel-test/bin/python "pyspark>=4.2.0" dist/*.whl

      - name: Verify packaged GDP entry point
        run: .venv-wheel-test/bin/olist-ibge-gdp --help
