[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-customer-intelligence"
version = "0.1.0"
description = "End-to-end Data Engineering platform using Databricks and the Olist dataset"
requires-python = ">=3.11"

dependencies = [
    "psycopg[binary]>=3.2,<4",
    "requests",
]

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib",
    "pandas",
    "pyspark>=4.2.0",
    "pytest",
    "ruff",
    "ty>=0.0.72",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
markers = [
    "integration: tests that require external or containerized services",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: erros de estilo e estrutura do código
    "F",   # Pyflakes: imports inválidos/não usados, variáveis indefinidas etc.
    "I",   # isort: organização e ordenação dos imports
    "UP",  # pyupgrade: moderniza sintaxe para versões atuais do Python
    "B",   # flake8-bugbear: padrões propensos a bugs e más práticas
]
